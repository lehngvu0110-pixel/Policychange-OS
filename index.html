<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PolicyChange OS</title>
<meta name="description" content="Trọng tài kiểm soát tài liệu khi quy định thay đổi — tự sửa chỗ chắc chắn, hỏi đúng người ở chỗ cần hỏi.">
<meta name="theme-color" content="#f3f5f9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%232447d6%22/%3E%3Cpath d=%22m8 12 3 3 5-6%22 stroke=%22white%22 stroke-width=%222.4%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="./css/app.css">
<script>
  // Áp giao diện đã chọn trước khi vẽ để tránh nháy màu.
  try { var t = localStorage.getItem('policychange-os:theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Bỏ qua tới nội dung</a>

<header class="topbar">
  <button class="iconbtn menu-btn" id="menuBtn" type="button" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="sidebar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#/tong-quan" aria-label="PolicyChange OS — Tổng quan">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
    </span>
    <span class="brand-name" translate="no">PolicyChange<span> OS</span></span>
  </a>
  <span class="pill conn" id="connPill" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="t">Đang tải…</span></span>
  <span class="pill ai" id="aiPill"><span class="dot" aria-hidden="true"></span><span class="t">AI</span></span>
  <span class="spacer"></span>
  <div class="persona" id="personaBox"></div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng / tối"></button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Điều hướng">
    <nav class="nav" id="nav" aria-label="Các màn hình"></nav>
    <div class="side-card" id="sideCard"></div>
    <p class="xs muted" style="padding:0 6px">Dữ liệu mẫu là <b>dữ liệu tổng hợp</b> do nhóm tự soạn, mô phỏng văn bản của một trường đại học.</p>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog id="loginDlg" aria-labelledby="loginTitle">
  <form id="loginForm" method="dialog" novalidate>
    <h2 id="loginTitle">Đăng nhập workspace thí điểm</h2>
    <p class="small muted">Tài khoản do quản trị cấp trong Supabase; cấp và đơn vị phụ trách của bạn quyết định bạn được duyệt những gì.</p>
    <label class="field" for="loginEmail">Email<input id="loginEmail" name="email" type="email" autocomplete="username" inputmode="email" spellcheck="false" placeholder="ten@truong.edu.vn…"></label>
    <label class="field" for="loginPw">Mật khẩu<input id="loginPw" name="password" type="password" autocomplete="current-password"></label>
    <p class="small" id="loginMsg" role="status" aria-live="polite"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="submit" value="cancel" formnovalidate>Huỷ</button>
      <button class="btn primary" type="submit" value="ok">Đăng nhập</button>
    </div>
  </form>
</dialog>

<noscript><p style="padding:24px">PolicyChange OS cần bật JavaScript.</p></noscript>

<!-- Lõi dùng chung với máy chủ (Edge Function) và bộ kiểm thử -->
<script src="./js/config.js"></script>
<script src="./js/sha256.js"></script>
<script src="./js/safe-html.js"></script>
<script src="./js/policy-engine.js"></script>
<script src="./js/policy-data.js"></script>
<script src="./js/policy-ledger.js"></script>
<script src="./js/semantic-discovery.js"></script>
<script src="./js/policy-prover.js"></script>
<script src="./js/policy-workflow.js"></script>
<script src="./js/policy-authz.js"></script>
<script src="./js/policy-server.js"></script>
<script src="./js/policy-ai.js"></script>
<script src="./js/policy-learning.js"></script>
<script src="./js/policy-evaluation.js"></script>
<script src="./js/policy-impact-graph.js"></script>
<script src="./js/policy-demo.js"></script>
<script src="./js/holdout-data.js"></script>
<!-- Lưu trữ và kết nối -->
<script src="./js/policy-store.js"></script>
<script src="./js/remote-store.js"></script>
<script src="./js/remote-ai-adapter.js"></script>
<!-- Ứng dụng -->
<script src="./js/app-controller.js"></script>
<script src="./js/app/graph.js"></script>
<script src="./js/app/ui.js"></script>
</body>
</html>
